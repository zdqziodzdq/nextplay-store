<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée — NEXTPLAY</title>
<style>
:root{
  --ink:#0d0e12;--panel:#15171d;--panel2:#1c1f27;--paper:#f3f1ea;
  --joy-blue:#00c3e3;--joy-red:#ff3c5c;--line:rgba(243,241,234,0.1);--muted:#9a9ea8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--ink);color:var(--paper);font-family:'Helvetica Neue',Arial,sans-serif;line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.thank-you{max-width:600px;padding:40px 24px;text-align:center;background:linear-gradient(135deg,rgba(0,195,227,.05),rgba(255,60,92,.05));border-radius:16px;border:1px solid var(--line);}
.success-icon{font-size:80px;margin-bottom:20px;}
h1{font-family:'Arial Black',Impact,sans-serif;letter-spacing:-0.02em;text-transform:uppercase;font-size:32px;margin-bottom:16px;background:linear-gradient(90deg,var(--joy-blue),var(--joy-red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.order-details{margin:32px 0;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;}
.detail-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
.detail-row:last-child{border-bottom:none;}
.label{color:var(--muted);font-size:14px;}
.value{font-weight:700;color:var(--paper);}
.cta{display:inline-block;margin-top:32px;padding:14px 32px;background:var(--joy-blue);color:#0d0e12;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;text-decoration:none;border-radius:4px;font-size:14px;border:none;cursor:pointer;}
.cta:hover{background:#00a8d4;}
.support{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
a{color:var(--joy-blue);text-decoration:underline;}
</style>
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2042316826405673');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2042316826405673&ev=PageView&noscript=1" /></noscript>
<!-- End Meta Pixel Code -->
<script defer src="https://shown.io/metrics/L73YrWrK8M" type="text/javascript"></script>
</head>
<body>
<div class="thank-you">
  <div class="success-icon">✓</div>
  <h1>Merci pour votre achat !</h1>
  <p style="color:var(--muted);margin-bottom:24px;">Votre commande a été confirmée et sera expédiée sous 24h.</p>
  
  <div class="order-details">
    <div class="detail-row">
      <span class="label">Numéro de commande</span>
      <span class="value" id="order-id">—</span>
    </div>
    <div class="detail-row">
      <span class="label">Produit</span>
      <span class="value">Nintendo Switch 2</span>
    </div>
    <div class="detail-row">
      <span class="label">Montant</span>
      <span class="value" id="order-amount">299,00 €</span>
    </div>
    <div class="detail-row">
      <span class="label">Livraison estimée</span>
      <span class="value">J+2</span>
    </div>
  </div>

  <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">Un email de confirmation a été envoyé à votre adresse.</p>
  
  <a href="/" class="cta">Retourner à l'accueil</a>
  
  <div class="support">
    Des questions ? <a href="mailto:support@nextplay-store.com">Contactez notre support</a>
  </div>
</div>

<script>
// Meta Pixel Purchase Event
document.addEventListener('DOMContentLoaded', function() {
  // Récupère les paramètres de l'URL (si disponibles)
  const params = new URLSearchParams(window.location.search);
  const amount = params.get('amount') || 29900; // montant en centimes
  const amountEUR = amount / 100; // conversion en EUR
  const orderId = params.get('order_id') || 'ORD-' + Date.now();
  
  // Affiche les détails dans la page
  document.getElementById('order-amount').textContent = amountEUR.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
  document.getElementById('order-id').textContent = orderId;
  
  // Déclenche l'événement Purchase de Meta Pixel
  fbq('track', 'Purchase', {
    value: amountEUR,           // Montant en EUR (299)
    currency: 'EUR',
    content_name: 'Nintendo Switch 2',
    content_ids: ['SW2-001'],   // ID du produit
    content_type: 'product',
    num_items: 1,
    order_id: orderId
  });
  
  // Événement Shown.io (optionnel, si tu l'utilises)
  if(window.shown) {
    window.shown('event', 'purchase', { value: amount / 100, orderId: orderId });
  }
});
</script>
</body>
</html>
